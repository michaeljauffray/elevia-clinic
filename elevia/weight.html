<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevia Clinic — Coming Soon</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --teal: #1a5c52;
    --teal-dark: #0f3d36;
    --teal-light: #2a7a6e;
    --cream: #f8f5f0;
    --cream-dark: #efe9e0;
    --gold: #c9a96e;
    --text-dark: #1e2a27;
    --text-mid: #4a5a56;
    --text-light: #7a8a86;
    --white: #ffffff;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Libre Franklin', system-ui, sans-serif;
  }

  body {
    font-family: var(--sans);
    color: var(--text-dark);
    background: var(--cream);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .wrap { max-width: 540px; }

  .badge {
    display: inline-block;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    margin-bottom: 1.75rem;
  }

  .logo {
    font-family: var(--serif);
    font-size: 1.5rem;
    color: var(--teal);
    margin-bottom: 2.5rem;
    letter-spacing: 0.02em;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    color: var(--teal-dark);
    line-height: 1.1;
    margin-bottom: 1.25rem;
  }

  p {
    color: var(--text-mid);
    font-size: 1.08rem;
    font-weight: 300;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Elevia Clinic</div>
    <span class="badge">Coming Soon</span>
    <h1>This page is under construction</h1>
    <p>We're putting the finishing touches on something new. Please check back soon.</p>
  </div>
</body>
</html>
